baseURL       = "https://ai-news-daily.xyz/"
theme         = "PaperMod"

# English is the original and stays at the site root; the Slovak edition
# lives under /sk/. A Slovak post is <slug>.sk.md next to <slug>.md.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

publishDir    = "public"
canonifyURLs  = true
enableRobotsTXT = true   # rendered from layouts/robots.txt

# Only tags are used; this drops the empty /categories/ pages.
[taxonomies]
  tag = "tags"

[pagination]
  pagerSize = 12

[services.rss]
  limit = 50             # full text is included, so keep the feed bounded

[params]
  env         = "production"
  author      = "Martin Seckar"
  mainSections = ["posts"]
  defaultTheme = "auto"
  displayFullLangName = true

  # Default social-share image for pages without a cover image.
  images = ["images/og-default.png"]

  ShowReadingTime   = true
  ShowBreadCrumbs   = true
  ShowPostNavLinks  = true
  ShowShareButtons  = true
  ShareButtons      = ["linkedin", "x", "reddit", "ycombinator"]
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  comments          = true   # renders layouts/partials/comments.html (follow box)

  [params.label]
    text       = "AI News Daily"
    icon       = "/apple-touch-icon.png"
    iconHeight = 28

  [params.schema]
    publisherType = "Organization"
    sameAs = ["https://aiplayground.substack.com/"]

  [params.assets]
    favicon        = "/logo-512.png"   # also used as the schema.org logo; /favicon.ico stays for old browsers
    favicon16x16   = "/favicon-16x16.png"
    favicon32x32   = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"
    theme_color    = "#1d1e20"
    msapplication_TileColor = "#1d1e20"

  [params.fuseOpts]
    keys = ["title", "summary", "content"]
    threshold = 0.3
    ignoreLocation = true

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    title        = "AI News Daily"
    weight       = 1
    [languages.en.params]
      description = "Source-checked AI news every morning: model releases from labs worldwide, research, what people are building, essays and community discussion. Each article links its primary sources and labels every key claim."
      DateFormat  = "2 January 2006"
      [languages.en.params.homeInfoParams]
        Title   = "AI News Daily"
        Content = """
Source-checked AI news, every morning. Each day brings six articles and one digest on new models from labs worldwide, research, essays, local models and agents, and prompting techniques. Every article ends with a verification table that links the primary sources.

[How we work](/about/) · [Archive](/archives/) · [RSS feed](/index.xml) · [For AI assistants](/llms.txt) · [Slovenské vydanie](/sk/)
"""
      [[languages.en.params.socialIcons]]
        name = "substack"
        url  = "https://aiplayground.substack.com/"
      [[languages.en.params.socialIcons]]
        name = "rss"
        url  = "/index.xml"
    [[languages.en.menus.main]]
      name   = "Archive"
      url    = "/archives/"
      weight = 10
    [[languages.en.menus.main]]
      name   = "Topics"
      url    = "/tags/"
      weight = 20
    [[languages.en.menus.main]]
      name   = "Search"
      url    = "/search/"
      weight = 30
    [[languages.en.menus.main]]
      name   = "About"
      url    = "/about/"
      weight = 40

  [languages.sk]
    languageName = "Slovenčina"
    languageCode = "sk"
    title        = "AI News Daily"
    weight       = 2
    [languages.sk.params]
      description = "Správy o umelej inteligencii s overenými zdrojmi, každé ráno: nové modely z laboratórií z celého sveta, výskum, čo ľudia tvoria, eseje a diskusie komunity. Každý článok odkazuje na primárne zdroje a pri kľúčových tvrdeniach uvádza, nakoľko sú overené."
      DateFormat  = ":date_long"
      [languages.sk.params.homeInfoParams]
        Title   = "AI News Daily po slovensky"
        Content = """
Správy o umelej inteligencii s overenými zdrojmi, každé ráno. Každý deň šesť článkov a jeden prehľad o nových modeloch z laboratórií z celého sveta, výskume, esejach, lokálnych modeloch a agentoch a technikách promptovania. Každý článok končí tabuľkou overenia s odkazmi na primárne zdroje. Slovenské vydanie vzniká prekladom anglických článkov pomocou AI.

[Ako pracujeme](/sk/about/) · [Archív](/sk/archives/) · [RSS kanál](/sk/index.xml) · [English edition](/)
"""
      [[languages.sk.params.socialIcons]]
        name = "substack"
        url  = "https://aiplayground.substack.com/"
      [[languages.sk.params.socialIcons]]
        name = "rss"
        url  = "/sk/index.xml"
    [[languages.sk.menus.main]]
      name   = "Archív"
      url    = "/archives/"
      weight = 10
    [[languages.sk.menus.main]]
      name   = "Témy"
      url    = "/tags/"
      weight = 20
    [[languages.sk.menus.main]]
      name   = "Hľadať"
      url    = "/search/"
      weight = 30
    [[languages.sk.menus.main]]
      name   = "O nás"
      url    = "/about/"
      weight = 40

# Plain-text and Markdown views for LLMs and AI assistants (see llmstxt.org).
[outputFormats.llms]
  mediaType   = "text/plain"
  baseName    = "llms"
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  mediaType   = "text/plain"
  baseName    = "llms-full"
  isPlainText = true
  notAlternative = true

[outputFormats.markdown]
  mediaType   = "text/markdown"
  baseName    = "index"
  isPlainText = true
  rel         = "alternate"

[outputs]
  home    = ["HTML", "RSS", "JSON", "llms", "llmsfull"]
  section = ["HTML", "RSS"]
  page    = ["HTML", "markdown"]
