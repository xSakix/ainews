patterns:
  - id: factor
    en: "by a factor of N"
    target: "N-krát, N-násobne, N-násobok"
    before: "o menej než násobok 2"
    after: "o menej než dvojnásobok"
    note: Do not strengthen a vague English phrase ("a factor she cannot explain") into „mnohonásobne“; say what the English says.
    status: confirmed
    evidence: [SK-089, SK-092]

  - id: under-a-prompt
    en: "under a prompt / setting / condition"
    target: "pri prompte / pri nastavení / za podmienky"
    before: "Správanie pod bežným promptom asistenta sa nemení."
    after: "Správanie pri bežnom prompte asistenta sa nemení."
    status: confirmed
    evidence: [SK-076, SK-077, SK-125]

  - id: inanimate-subject
    en: "A paper / report / result + verb of a person (asks, finds, transferred, shows)"
    target: "Štúdia skúma ... ; Prenášalo sa ... (bezpodmetová alebo trpná konštrukcia)"
    before: "Preprint, ktorý sa pýta, čo spotreba tokenov vlastne meria."
    after: "Preprint skúma, čo vlastne meria spotreba tokenov."
    note: >
      "sa pýta" is fine where English says "asks" about a person or a talk.
      "Výsledok preniesol X" -> "X sa prenieslo aj cez Y".
    status: confirmed
    evidence: [SK-078, SK-096]

  - id: ing-modifier
    en: "-ing modifier after a noun (an assistant watching ..., users using ...)"
    target: "vedľajšia veta s „ktorý“, nie činné príčastie na -úci"
    before: "Asistent sledujúci pracovisko, robot konajúci medzi ľuďmi."
    after: "Asistent, ktorý sleduje pracovisko, robot, ktorý koná medzi ľuďmi."
    status: confirmed
    evidence: [SK-097, SK-135]

  - id: noun-chain
    en: "noun chain (scaling the method to frontier training; dataset audits need interaction tests)"
    target: "sloveso alebo predložková väzba (pri trénovaní ..., ak sa ...)"
    before: "Škálovanie metódy na trénovanie hraničných modelov by vyžadovalo ..."
    after: "Aby sa metóda dala použiť pri trénovaní špičkových modelov, bolo by treba ..."
    status: confirmed
    evidence: [SK-026]

  - id: quote-with-gloss
    en: "a quotation in the source (English or not)"
    target: "iba slovenský preklad v „…“; originál sa v zátvorke nepridáva"
    before: "„tam ešte nie je“ („is not there yet“)"
    after: "„tam ešte nie je“"
    note: >
      Also for programme and product names inside a quotation: keep the English
      name and add nothing around it that is not in the source.
    status: confirmed
    evidence: [SK-046, SK-047, SK-048, SK-049]

  - id: comparison-twice
    en: "fell by more than twice as much as ..."
    target: "klesol viac než dvakrát výraznejšie ako ..."
    before: "počet ponúk klesol viac než dvojnásobne oproti najmenej vystaveným"
    after: "počet ponúk klesol viac než dvakrát výraznejšie ako v najmenej vystavených povolaniach"
    note: '"Viac než dvojnásobne" reads as "more than halved" - a different fact.'
    status: confirmed
    evidence: [SK-030]

  - id: ranking
    en: "73rd of 73 on cost"
    target: "na 73. mieste zo 73 podľa nákladov"
    before: "na 73. miesto zo 73 v nákladoch"
    after: "na 73. miesto zo 73 podľa nákladov"
    note: Keep the ordinal (fidelity rule 3) and add nothing („posledné“ is not in the English).
    status: confirmed
    evidence: [SK-127]

  - id: down-from
    en: "down from X (for the earlier version)"
    target: "oproti X"
    before: "po cene 10 a 50 dolárov pri verziách 5.1"
    after: "oproti 10 a 50 dolárom pri verziách 5.1"
    status: confirmed
    evidence: [SK-129]

  - id: headline-subject
    en: "Headline metonymy: Two Suppliers Fall 21%"
    target: "Podmetom je to, čo naozaj kleslo: akcie dvoch dodávateľov klesli o 21 %"
    before: "Voliči odmietli dátové centrá, dvaja dodávatelia klesli o 21 %"
    after: "Voliči odmietli dátové centrá, akcie dvoch dodávateľov klesli o 21 %"
    status: confirmed
    evidence: [SK-020]

  - id: headline-not-contrast
    en: "Headline 'X, not Y' with a shared modifier (better answers, not better reasoning)"
    target: "zopakuj modifikátor v oboch členoch"
    before: "Trénovanie odmenou vyberá lepšie odpovede, nie uvažovanie"
    after: "Trénovanie odmenou vyberá lepšie odpovede, nie lepšie uvažovanie"
    status: confirmed
    evidence: [SK-019]

  - id: headline-one-of
    en: "AI is one suspect"
    target: "AI je jednou z podozrivých"
    before: "Podiel práce na výstupe je rekordne nízky, AI je len podozrivá"
    after: "Podiel práce na výstupe je rekordne nízky, AI je jednou z podozrivých"
    status: confirmed
    evidence: [SK-018]

  - id: imagine
    en: "Picture / Imagine / Suppose / Consider a ... (addresses the reader)"
    target: "Predstavme si ..."
    before: "Predstavte si koordinátorku predmetu ..."
    after: "Predstavme si koordinátorku predmetu ..."
    note: The prompt forbids addressing the reader; 11 of 42 openings still use "Predstavte si".
    status: confirmed
    evidence: [SK-142, SK-144, SK-146]

# ---------------------------------------------------------------------------
style:
  headlines:
    - Sentence case; a headline states what happened, not what a section is about.
    - The subject of the Slovak headline is the thing that did or underwent the action (shares fell, not suppliers).
    - Do not drop a modifier when the English shares it between two members ("better answers, not better reasoning").
    - Do not translate a subhead word for word; ask what the section tells the reader.
    - 'Digest title stays "Denný prehľad AI – D. mesiaca YYYY".'
  numbers:
    - 'Decimal comma, space before %: 1,1 %; never 1.1% (also inside ranges: 99,6–100 %).'
    - 'After a decimal number the unit is in the genitive singular: 3,4 tisíca riadkov, 1,2 milióna, 2,5 miliardy.'
    - 'Multiples: 2,5-krát; 39- až 240-krát; a rate x count is "súčin".'
    - 'A ranking keeps its ordinal (fidelity rule 3) and nothing is added: "na 73. mieste zo 73 podľa nákladov".'
  currency:
    - 'In running text use the word, declined: 283,82 dolára, 380 dolárov, 15 eur. ISO codes only in tables.'
    - 'Chinese yuan (RMB, CNY) is „jüan“: 5 miliónov jüanov, never 5 miliónov RMB.'
  dates:
    - 'Keep both ends of a range: od 15. septembra do 12. októbra 2026. Never drop the start.'
    - 'Day-month-year with the month in the genitive: 29. septembra 2026.'
  names:
    - 'Follow <slovak_style> in the prompt: decline company names where it sounds natural (Googlu, Microsoftu); for Anthropic, OpenAI, xAI and HPE use an apposition („spoločnosť Anthropic“, „aplikácie spoločnosti Anthropic“). A bare undeclined name as a genitive attribute is wrong („aplikácií Anthropic“).'
    - 'Product, programme, model and benchmark names stay in English, including inside quotations (Cyber Verification Program).'
    - 'The noun „agent“ (software agent) is masculine animate in the plural, always: tí agenti, programátorskí agenti, výskumní agenti, nákupní agenti, agenti, ktorí ..., agenti napísali. Never inanimate (tie agenty, nákupné agenty, agenty otvorili, agentov, ktoré) and never mixed in one phrase (susedné agenti -> susední agenti).'
    - 'People''s names, first names and surnames, foreign ones included, are declined by Slovak grammar (Woodsidea, Woodsideove čísla, Erika Brynjolfssona).'
  register:
    - 'No direct address of the reader ("Predstavme si", not "Predstavte si").'
    - 'Technical but not slangy; keep the English term only where the map says so.'
    - 'No English noun + noun compounds copied without declension or an adjective (shell pravidlá, model hodnotiteľ, attention okno). Use an adjective, a genitive or a preposition: pravidlá pre shell, hodnotiaci model, okno pozornosti.'
    - 'Relative clauses after a noun: never „kedy“ (prípad, keď ... / pri ktorom ...). „kde“ only for a place; for abstract nouns write v ktorom / v ktorej (benchmark, v ktorom; štúdia, v ktorej).'
