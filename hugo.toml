# Plain-text and Markdown views for LLMs and AI assistants (see llmstxt.org).
[outputFormats.llms]
  mediaType   = "text/plain"
  baseName    = "llms"
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  mediaType   = "text/plain"
  baseName    = "llms-full"
  isPlainText = true
  notAlternative = true

[outputFormats.markdown]
  mediaType   = "text/markdown"
  baseName    = "index"
  isPlainText = true
  rel         = "alternate"

[outputs]
  home    = ["HTML", "RSS", "JSON", "llms", "llmsfull"]
  section = ["HTML", "RSS"]
  page    = ["HTML", "markdown"]
